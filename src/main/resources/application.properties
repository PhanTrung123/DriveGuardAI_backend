spring.application.name=DriveGuardAI

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/DriveGuardAI?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.devtools.livereload.enabled=true
server.servlet.session.tracking-modes=cookie
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.platform=mysql
spring.session.timeout=30m
server.servlet.session.timeout=30m